<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>整數乘分數極速挑戰 | 3分鐘數學MC遊戲</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient-start: #f0f9ff;
      --bg-gradient-end: #e0e7ff;
    }

    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 遊戲進行中鎖定全螢幕高度並防止 iPad Safari 意外捲動 */
    body.in-game-lock {
      overflow: hidden;
      overscroll-behavior: none;
    }

    .font-math {
      font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
    }

    /* 教科書式上下堆疊分數樣式（支援 iPad 響應式縮放） */
    .math-expr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45em;
      vertical-align: middle;
      line-height: 1.1;
    }

    .mixed-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.18em;
      vertical-align: middle;
    }

    .whole-part {
      font-weight: 800;
      line-height: 1;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      text-align: center;
      font-weight: 700;
      line-height: 1.05;
    }

    .fraction .num {
      padding: 0 0.28em 0.1em 0.28em;
      border-bottom: 2.5px solid currentColor;
      width: 100%;
    }

    .fraction .den {
      padding: 0.12em 0.28em 0 0.28em;
      width: 100%;
    }

    /* 題目區較粗的分數線與 iPad 遠距清晰字體 */
    .problem-display {
      font-size: clamp(2.4rem, 5.5vw, 4rem);
    }

    .problem-display .fraction {
      font-size: clamp(1.75rem, 4vw, 2.85rem);
    }

    .problem-display .fraction .num {
      border-bottom-width: 3.5px;
    }

    .option-math-display {
      font-size: clamp(1.65rem, 3.4vw, 2.35rem);
    }

    .option-math-display .fraction {
      font-size: clamp(1.25rem, 2.6vw, 1.8rem);
    }

    /* 動畫效果 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .animate-shake {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes floatPenalty {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.9);
      }
      40% {
        opacity: 1;
        transform: translateY(-16px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translateY(-34px) scale(1);
      }
    }

    .floating-badge {
      position: absolute;
      pointer-events: none;
      animation: floatPenalty 0.85s ease-out forwards;
      z-index: 50;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop-in {
      animation: popIn 0.22s ease-out forwards;
    }

    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .timer-urgent {
      animation: pulseUrgent 0.8s infinite ease-in-out;
    }

    /* iPad 觸控選項按鈕互動狀態 */
    .mc-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .mc-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    /* 自訂捲軸（錯題檢討區） */
    .custom-scrollbar {
      -webkit-overflow-scrolling: touch;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-800 flex items-center justify-center p-3 sm:p-5 md:p-6">

  <script>
    /**
     * 整數乘分數極速挑戰 - 核心邏輯
     * 規則：
     * - 限時 180 秒 (3:00)
     * - 答對 +1 分
     * - 答錯 -3 秒
     * - 4選1 MC，所有答案皆化為最簡分數（真分數、帶分數或整數）
     */

    // ==================== 狀態管理 ====================
    const GAME_DURATION = 180; // 3 分鐘 = 180 秒
    const PENALTY_SECONDS = 3; // 答錯扣 3 秒

    const state = {
      isPlaying: false,
      timeLeft: GAME_DURATION,
      timerInterval: null,
      score: 0,
      streak: 0,
      maxStreak: 0,
      questionNumber: 0,
      correctCount: 0,
      wrongCount: 0,
      currentQuestion: null,
      isTransitioning: false,
      soundEnabled: true,
      wrongHistory: [] // 儲存 { questionHtml, userChoiceHtml, correctChoiceHtml }
    };

    // ==================== DOM 元素快取 ====================
    const els = {
      startScreen: document.getElementById('start-screen'),
      gameScreen: document.getElementById('game-screen'),
      endScreen: document.getElementById('end-screen'),
      startBtn: document.getElementById('start-btn'),
      restartBtn: document.getElementById('restart-btn'),
      homeBtn: document.getElementById('home-btn'),
      soundToggleBtn: document.getElementById('sound-toggle-btn'),

      timerBox: document.getElementById('timer-box'),
      timerDisplay: document.getElementById('timer-display'),
      timeProgressBar: document.getElementById('time-progress-bar'),
      penaltyAnchor: document.getElementById('penalty-anchor'),
      bonusAnchor: document.getElementById('bonus-anchor'),

      scoreDisplay: document.getElementById('score-display'),
      streakBadge: document.getElementById('streak-badge'),
      streakText: document.getElementById('streak-text'),

      questionCard: document.getElementById('question-card'),
      questionCounter: document.getElementById('question-counter'),
      problemContainer: document.getElementById('problem-container'),
      feedbackBanner: document.getElementById('feedback-banner'),
      optionsGrid: document.getElementById('options-grid'),

      finalScore: document.getElementById('final-score'),
      finalCorrect: document.getElementById('final-correct'),
      finalWrong: document.getElementById('final-wrong'),
      finalAccuracy: document.getElementById('final-accuracy'),
      endComment: document.getElementById('end-comment'),
      reviewSection: document.getElementById('review-section'),
      wrongCountBadge: document.getElementById('wrong-count-badge'),
      wrongList: document.getElementById('wrong-list'),
      perfectSection: document.getElementById('perfect-section')
    };

    // ==================== 音效合成 (Web Audio API，無需外部檔案) ====================
    let audioCtx = null;

    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
          // 清脆雙音上升提示
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.07); // A5
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'wrong') {
          // 低沉提示音
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(155, now + 0.22);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'end') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          osc.frequency.setValueAtTime(783.99, now + 0.24);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {
        // 忽略瀏覽器音效阻擋錯誤
      }
    }

    // ==================== 數學與分數工具函式 ====================

    /**
     * 計算最大公因數 (GCD)
     */
    function gcd(a, b) {
      a = Math.abs(Math.round(a));
      b = Math.abs(Math.round(b));
      while (b !== 0) {
        const temp = b;
        b = a % b;
        a = temp;
      }
      return a || 1;
    }

    /**
     * 將假分數 num/den 化簡為標準結構物件
     * 回傳格式: { whole, num, den, rawNum, rawDen, key }
     * 其中 key 用於去重比較，例如 "4|1/2" 或 "6|0/1"
     */
    function simplifyFraction(rawNum, rawDen) {
      if (rawDen === 0) rawDen = 1;
      const g = gcd(rawNum, rawDen);
      const simpNum = rawNum / g;
      const simpDen = rawDen / g;

      const whole = Math.floor(simpNum / simpDen);
      const remNum = simpNum % simpDen;

      return {
        whole: whole,
        num: remNum,
        den: remNum === 0 ? 1 : simpDen,
        rawNum: simpNum,
        rawDen: simpDen,
        key: `${whole}|${remNum}/${remNum === 0 ? 1 : simpDen}`
      };
    }

    /**
     * 建立未約分的分數物件（用於刻意產生「忘記約分」的干擾選項）
     */
    function unsimplifiedFraction(rawNum, rawDen) {
      const whole = Math.floor(rawNum / rawDen);
      const remNum = rawNum % rawDen;
      return {
        whole: whole,
        num: remNum,
        den: remNum === 0 ? 1 : rawDen,
        rawNum: rawNum,
        rawDen: rawDen,
        key: `raw:${rawNum}/${rawDen}`
      };
    }

    /**
     * 將分數結構渲染為教科書式上下堆疊 HTML
     * @param {Object} fracObj - simplifyFraction 回傳的物件
     * @param {String} fracSizeClass - 控制分數數字大小的 Tailwind 類別
     */
    function renderFractionHTML(fracObj, fracSizeClass = 'text-xl sm:text-2xl') {
      // 純整數
      if (fracObj.num === 0) {
        return `<span class="whole-part">${fracObj.whole}</span>`;
      }

      const fracPart = `
        <span class="fraction ${fracSizeClass}">
          <span class="num">${fracObj.num}</span>
          <span class="den">${fracObj.den}</span>
        </span>
      `;

      // 純真分數
      if (fracObj.whole === 0) {
        return fracPart;
      }

      // 帶分數
      return `
        <span class="mixed-number">
          <span class="whole-part">${fracObj.whole}</span>
          ${fracPart}
        </span>
      `;
    }

    // ==================== 題目與干擾選項生成器 ====================

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /**
     * 生成一道「整數 × 分數」或「分數 × 整數」題目及 4 個 MC 選項
     * 嚴格數值限制：
     * 1. 乘數整數：2 ~ 15（唔大過 15）
     * 2. 題目中的分數（真分數或帶分數）以及所有 4 個選項中的帶分數：整數部分皆 <= 5（帶分數唔大過 5）
     */
    function generateQuestion() {
      const MAX_INTEGER = 15;
      const MAX_MIXED_WHOLE = 5;

      let attempt = 0;
      while (attempt < 150) {
        attempt++;

        // 1. 決定分母 (2 ~ 12)
        const den = randInt(2, 12);

        // 2. 決定題目分數：真分數（80%）或帶分數（20%，整數部分 1 ~ 3 以確保乘積合理）
        let fracWhole = 0;
        const isMixedQuestion = Math.random() < 0.22 && den <= 8;
        if (isMixedQuestion) {
          fracWhole = randInt(1, 3);
        }

        // 確保分子與分母互質，讓題目本身是最簡分數
        const coprimes = [];
        for (let n = 1; n < den; n++) {
          if (gcd(n, den) === 1) coprimes.push(n);
        }
        const num = coprimes[randInt(0, coprimes.length - 1)];

        // 3. 決定整數 (2 ~ 15)，且讓計算結果的帶分數整數部分不超過 5
        // 計算最大允許整數，使 (integer * (fracWhole * den + num)) / den < 6（即帶分數整數部分 <= 5）
        const improperNum = fracWhole * den + num;
        const maxAllowedInt = Math.min(MAX_INTEGER, Math.floor((MAX_MIXED_WHOLE * den + (den - 1)) / improperNum));

        if (maxAllowedInt < 2) continue;

        let integer;
        if (Math.random() < 0.72) {
          const factors = [];
          for (let k = 2; k <= maxAllowedInt; k++) {
            if (gcd(k, den) > 1) factors.push(k);
          }
          integer = factors.length > 0 ? factors[randInt(0, factors.length - 1)] : randInt(2, maxAllowedInt);
        } else {
          integer = randInt(2, maxAllowedInt);
        }

        // 計算正確答案並檢查是否符合「帶分數整數部分 <= 5」
        const ansRawNum = integer * improperNum;
        const ansRawDen = den;
        const correctAns = simplifyFraction(ansRawNum, ansRawDen);

        // 若答案為帶分數（num > 0），其整數部分不得大於 5
        if (correctAns.num > 0 && correctAns.whole > MAX_MIXED_WHOLE) {
          continue;
        }
        // 若答案為純整數，也控制在合理範圍內
        if (correctAns.num === 0 && correctAns.whole > MAX_INTEGER) {
          continue;
        }

        // 隨機決定排列順序：整數 × 分數 或 分數 × 整數
        const integerFirst = Math.random() < 0.5;
        const fracDisplayObj = { whole: fracWhole, num: num, den: den };

        const integerHtml = `<span class="whole-part">${integer}</span>`;
        const fractionHtml = renderFractionHTML(fracDisplayObj);

        const questionHtml = integerFirst
          ? `<span class="math-expr">${integerHtml}<span class="text-indigo-500 font-bold">×</span>${fractionHtml}</span>`
          : `<span class="math-expr">${fractionHtml}<span class="text-indigo-500 font-bold">×</span>${integerHtml}</span>`;

        // 生成 3 個具代表性的學生常見錯誤干擾選項（同時嚴格遵守帶分數整數部分 <= 5）
        const distractors = [];
        const usedKeys = new Set([correctAns.key]);

        function tryAddDistractor(obj) {
          if (!obj) return false;
          // 排除與正確答案數值完全相同且已化簡的選項
          if (obj.whole === correctAns.whole && obj.num === correctAns.num && obj.den === correctAns.den) {
            return false;
          }
          if (obj.whole < 0 || obj.num < 0 || obj.den <= 0) return false;
          // 嚴格限制：所有干擾選項若為帶分數，整數部分同樣不得超過 5；若為純整數不得超過 15
          if (obj.num > 0 && obj.whole > MAX_MIXED_WHOLE) return false;
          if (obj.num === 0 && obj.whole > MAX_INTEGER) return false;
          if (usedKeys.has(obj.key)) return false;

          usedKeys.add(obj.key);
          distractors.push(obj);
          return true;
        }

        // 錯誤類型 A：誤將整數乘以分母
        tryAddDistractor(simplifyFraction(improperNum, integer * den));

        // 錯誤類型 B：未約分直接寫成帶分數或假分數（若原本可約分且整數部分 <= 5）
        if (gcd(ansRawNum, ansRawDen) > 1) {
          tryAddDistractor(unsimplifiedFraction(ansRawNum, ansRawDen));
        }

        // 錯誤類型 C：整數直接當作帶分數的整數部分（僅當 integer <= 5 時才加入，符合帶分數 <= 5 規則）
        if (fracWhole === 0 && integer <= MAX_MIXED_WHOLE && integer !== correctAns.whole) {
          tryAddDistractor({
            whole: integer,
            num: num,
            den: den,
            key: `${integer}|${num}/${den}`
          });
        }

        // 錯誤類型 D：分子計算差 1 或多乘/少乘
        tryAddDistractor(simplifyFraction(ansRawNum + 1, ansRawDen));
        if (ansRawNum > 1) {
          tryAddDistractor(simplifyFraction(ansRawNum - 1, ansRawDen));
        }

        // 錯誤類型 E：整數加減錯
        if (integer + 1 <= MAX_INTEGER) {
          tryAddDistractor(simplifyFraction((integer + 1) * improperNum, ansRawDen));
        }
        if (integer > 2) {
          tryAddDistractor(simplifyFraction((integer - 1) * improperNum, ansRawDen));
        }

        // 補足至 3 個干擾選項（保底邏輯，確保全部符合 <= 5 限制）
        let safetyCounter = 0;
        while (distractors.length < 3 && safetyCounter < 60) {
          safetyCounter++;
          const offset = randInt(-4, 5);
          if (offset === 0) continue;
          const candidateNum = Math.max(1, ansRawNum + offset);
          tryAddDistractor(simplifyFraction(candidateNum, ansRawDen));
        }

        // 若因極端條件未能湊滿 3 個合法干擾項，重新生成題目
        if (distractors.length < 3) {
          continue;
        }

        // 組合 4 個選項並洗牌
        const allChoices = [
          { ...correctAns, isCorrect: true },
          ...distractors.slice(0, 3).map(d => ({ ...d, isCorrect: false }))
        ];

        // Fisher-Yates 洗牌演算法
        for (let i = allChoices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allChoices[i], allChoices[j]] = [allChoices[j], allChoices[i]];
        }

        return {
          questionHtml,
          correctAns,
          choices: allChoices
        };
      }

      // 絕對保底題目（4 × 3/8 = 1 1/2）
      const fallbackCorrect = simplifyFraction(12, 8);
      return {
        questionHtml: `<span class="math-expr"><span class="whole-part">4</span><span class="text-indigo-500 font-bold">×</span>${renderFractionHTML({ whole: 0, num: 3, den: 8 })}</span>`,
        correctAns: fallbackCorrect,
        choices: [
          { ...fallbackCorrect, isCorrect: true },
          { ...simplifyFraction(3, 32), isCorrect: false },
          { ...unsimplifiedFraction(12, 8), isCorrect: false },
          { ...simplifyFraction(4, 2), isCorrect: false }
        ]
      };
    }

    // ==================== 畫面渲染與互動邏輯 ====================

    function formatTime(seconds) {
      const safeSec = Math.max(0, Math.ceil(seconds));
      const mins = Math.floor(safeSec / 60);
      const secs = safeSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      els.timerDisplay.textContent = formatTime(state.timeLeft);
      const pct = Math.max(0, Math.min(100, (state.timeLeft / GAME_DURATION) * 100));
      els.timeProgressBar.style.width = `${pct}%`;

      if (state.timeLeft <= 15) {
        els.timerBox.classList.remove('bg-slate-100');
        els.timerBox.classList.add('bg-rose-100', 'text-rose-700');
        els.timerDisplay.classList.remove('text-slate-800');
        els.timerDisplay.classList.add('text-rose-600', 'timer-urgent');
        els.timeProgressBar.classList.remove('from-indigo-500', 'to-sky-400');
        els.timeProgressBar.classList.add('from-rose-500', 'to-orange-400');
      } else {
        els.timerBox.classList.add('bg-slate-100');
        els.timerBox.classList.remove('bg-rose-100', 'text-rose-700');
        els.timerDisplay.classList.add('text-slate-800');
        els.timerDisplay.classList.remove('text-rose-600', 'timer-urgent');
        els.timeProgressBar.classList.add('from-indigo-500', 'to-sky-400');
        els.timeProgressBar.classList.remove('from-rose-500', 'to-orange-400');
      }
    }

    function updateScoreUI() {
      els.scoreDisplay.textContent = state.score;
      if (state.streak >= 2) {
        els.streakBadge.classList.remove('hidden');
        els.streakText.textContent = `連對 ${state.streak} 題`;
      } else {
        els.streakBadge.classList.add('hidden');
      }
    }

    function spawnFloatingBadge(anchorEl, text, colorClasses) {
      const badge = document.createElement('div');
      badge.className = `floating-badge font-math font-black text-base sm:text-lg px-2.5 py-0.5 rounded-full shadow-md ${colorClasses}`;
      badge.textContent = text;
      anchorEl.appendChild(badge);
      setTimeout(() => {
        badge.remove();
      }, 850);
    }

    function renderNextQuestion() {
      if (!state.isPlaying) return;

      state.questionNumber++;
      state.isTransitioning = false;
      state.currentQuestion = generateQuestion();

      els.questionCounter.textContent = `第 ${state.questionNumber} 題`;
      els.problemContainer.innerHTML = state.currentQuestion.questionHtml;

      // 隱藏回饋提示
      els.feedbackBanner.style.opacity = '0';
      els.feedbackBanner.textContent = '';

      // 渲染 4 個 MC 按鈕（iPad 大觸控熱區，最小高度 92px ~ 116px）
      const labels = ['A', 'B', 'C', 'D'];
      els.optionsGrid.innerHTML = state.currentQuestion.choices
        .map((choice, idx) => {
          const choiceHtml = renderFractionHTML(choice, '');
          return `
            <button type="button" data-index="${idx}"
              class="mc-btn group relative bg-white hover:bg-indigo-50/70 border-2 border-slate-200 hover:border-indigo-400 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-sm hover:shadow-md flex items-center justify-center min-h-[92px] sm:min-h-[116px] cursor-pointer">
              <span class="absolute top-3 left-3.5 w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white text-slate-500 font-math font-bold text-sm sm:text-base flex items-center justify-center transition-colors">
                ${labels[idx]}
              </span>
              <div class="option-math-display font-math text-slate-800 pl-4">
                ${choiceHtml}
              </div>
            </button>
          `;
        })
        .join('');

      // 綁定按鈕點擊事件
      const buttons = els.optionsGrid.querySelectorAll('.mc-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          handleAnswer(idx);
        });
      });
    }

    function handleAnswer(selectedIndex) {
      if (!state.isPlaying || state.isTransitioning || !state.currentQuestion) return;

      const choice = state.currentQuestion.choices[selectedIndex];
      if (!choice) return;

      state.isTransitioning = true;
      const buttons = els.optionsGrid.querySelectorAll('.mc-btn');
      buttons.forEach(b => (b.disabled = true));

      const selectedBtn = buttons[selectedIndex];

      if (choice.isCorrect) {
        // 答對：+1 分
        state.score += 1;
        state.correctCount += 1;
        state.streak += 1;
        if (state.streak > state.maxStreak) state.maxStreak = state.streak;

        playTone('correct');
        updateScoreUI();
        spawnFloatingBadge(els.bonusAnchor, '+1 分', 'bg-emerald-500 text-white');

        selectedBtn.classList.remove('border-slate-200', 'bg-white');
        selectedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'ring-4', 'ring-emerald-500/20');

        els.feedbackBanner.textContent = '✅ 答對了！+1 分';
        els.feedbackBanner.className = 'h-7 flex items-center justify-center text-sm sm:text-base font-bold text-emerald-600 transition-opacity duration-150';
        els.feedbackBanner.style.opacity = '1';

        setTimeout(() => {
          if (state.isPlaying) renderNextQuestion();
        }, 280);
      } else {
        // 答錯：扣 3 秒
        state.wrongCount += 1;
        state.streak = 0;
        state.timeLeft = Math.max(0, state.timeLeft - PENALTY_SECONDS);

        playTone('wrong');
        updateScoreUI();
        updateTimerUI();
        spawnFloatingBadge(els.penaltyAnchor, `-${PENALTY_SECONDS}秒`, 'bg-rose-600 text-white');

        // 震動與紅色警示
        els.questionCard.classList.remove('animate-shake');
        void els.questionCard.offsetWidth; // 觸發 reflow 重啟動畫
        els.questionCard.classList.add('animate-shake');

        selectedBtn.classList.remove('border-slate-200', 'bg-white');
        selectedBtn.classList.add('border-rose-500', 'bg-rose-50', 'ring-4', 'ring-rose-500/20');

        // 標示正確答案讓學生一眼看懂
        state.currentQuestion.choices.forEach((c, idx) => {
          if (c.isCorrect && buttons[idx]) {
            buttons[idx].classList.remove('border-slate-200', 'bg-white');
            buttons[idx].classList.add('border-emerald-500', 'bg-emerald-50/70');
          }
        });

        // 記錄錯題
        state.wrongHistory.push({
          questionHtml: state.currentQuestion.questionHtml,
          userChoiceHtml: renderFractionHTML(choice, 'text-base sm:text-lg'),
          correctChoiceHtml: renderFractionHTML(state.currentQuestion.correctAns, 'text-base sm:text-lg')
        });

        els.feedbackBanner.textContent = `❌ 答錯了！時間扣除 ${PENALTY_SECONDS} 秒`;
        els.feedbackBanner.className = 'h-7 flex items-center justify-center text-sm sm:text-base font-bold text-rose-600 transition-opacity duration-150';
        els.feedbackBanner.style.opacity = '1';

        if (state.timeLeft <= 0) {
          setTimeout(() => endGame(), 320);
        } else {
          setTimeout(() => {
            if (state.isPlaying) renderNextQuestion();
          }, 520);
        }
      }
    }

    function startGame() {
      // 重設所有狀態
      clearInterval(state.timerInterval);
      state.isPlaying = true;
      state.timeLeft = GAME_DURATION;
      state.score = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.questionNumber = 0;
      state.correctCount = 0;
      state.wrongCount = 0;
      state.wrongHistory = [];
      state.isTransitioning = false;
      // 切換畫面並鎖定 iPad 視窗捲動
      document.body.classList.add('in-game-lock');
      els.startScreen.classList.add('hidden');
      els.endScreen.classList.add('hidden');
      els.gameScreen.classList.remove('hidden');

      updateTimerUI();
      updateScoreUI();
      renderNextQuestion();

      // 啟動每秒倒數計時器
      state.timerInterval = setInterval(() => {
        if (!state.isPlaying) return;
        state.timeLeft -= 1;
        updateTimerUI();

        if (state.timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      if (!state.isPlaying) return;
      state.isPlaying = false;
      clearInterval(state.timerInterval);
      document.body.classList.remove('in-game-lock');
      playTone('end');

      // 計算統計數據
      const totalAttempted = state.correctCount + state.wrongCount;
      const accuracy = totalAttempted > 0 ? Math.round((state.correctCount / totalAttempted) * 100) : 0;

      els.finalScore.textContent = state.score;
      els.finalCorrect.textContent = state.correctCount;
      els.finalWrong.textContent = state.wrongCount;
      els.finalAccuracy.textContent = `${accuracy}%`;

      // 評語
      if (state.score >= 30) {
        els.endComment.textContent = '神級計算速度！約分技巧已經爐火純青！';
      } else if (state.score >= 20) {
        els.endComment.textContent = '非常優秀！計算又快又準！';
      } else if (state.score >= 10) {
        els.endComment.textContent = '表現不錯！多練習約分會更快喔！';
      } else {
        els.endComment.textContent = '再接再厲！記住：先約分、再相乘！';
      }

      // 渲染錯題檢討列表
      if (state.wrongHistory.length > 0) {
        els.reviewSection.classList.remove('hidden');
        els.perfectSection.classList.add('hidden');
        els.wrongCountBadge.textContent = `${state.wrongHistory.length} 題`;

        els.wrongList.innerHTML = state.wrongHistory
          .map((item, idx) => `
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center">
                  ${idx + 1}
                </span>
                <div class="font-math text-lg sm:text-xl text-slate-800">
                  ${item.questionHtml}
                </div>
              </div>
              <div class="flex items-center gap-4 text-sm sm:text-base font-math">
                <div class="flex items-center gap-1.5 text-rose-600 bg-rose-50 px-2.5 py-1 rounded-xl border border-rose-200">
                  <span class="text-xs font-sans font-bold">你的答案:</span>
                  <span>${item.userChoiceHtml}</span>
                </div>
                <div class="flex items-center gap-1.5 text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200">
                  <span class="text-xs font-sans font-bold">正解:</span>
                  <span>${item.correctChoiceHtml}</span>
                </div>
              </div>
            </div>
          `)
          .join('');
      } else {
        els.reviewSection.classList.add('hidden');
        if (totalAttempted > 0) {
          els.perfectSection.classList.remove('hidden');
        } else {
          els.perfectSection.classList.add('hidden');
        }
      }

      // 切換至結算畫面
      els.gameScreen.classList.add('hidden');
      els.endScreen.classList.remove('hidden');
    }

    function returnHome() {
      clearInterval(state.timerInterval);
      state.isPlaying = false;
      document.body.classList.remove('in-game-lock');
      els.gameScreen.classList.add('hidden');
      els.endScreen.classList.add('hidden');
      els.startScreen.classList.remove('hidden');
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      els.soundToggleBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
    }

    // ==================== 事件監聽 ====================
    els.startBtn.addEventListener('click', startGame);
    els.restartBtn.addEventListener('click', startGame);
    els.homeBtn.addEventListener('click', returnHome);
    els.soundToggleBtn.addEventListener('click', toggleSound);

    // 防止 iPad Safari 雙擊放大手勢
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 鍵盤快捷鍵支援 (1-4 或 A-D)
    document.addEventListener('keydown', (e) => {
      if (!state.isPlaying || state.isTransitioning) return;

      const key = e.key.toLowerCase();
      if (key === '1' || key === 'a') {
        handleAnswer(0);
      } else if (key === '2' || key === 'b') {
        handleAnswer(1);
      } else if (key === '3' || key === 'c') {
        handleAnswer(2);
      } else if (key === '4' || key === 'd') {
        handleAnswer(3);
      }
    });
  </script>
</body>
</html>
